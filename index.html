 $('#view').innerHTML=`<div class="grid k4" style="margin-bottom:12px">
 <div class="card kpi"><div class="l">Total tagihan jatuh tempo Oktober</div><div class="v">${A.length}</div><div class="s">${rp(sum(A))}</div></div>
 <div class="card kpi"><div class="l">BAOF Belum Clear</div><div class="v" style="color:var(--red)">${B.length}</div><div class="s">${rp(sum(B))}</div></div>
 <div class="card kpi"><div class="l">BAOF Sudah Clear</div><div class="v" style="color:var(--grn)">${C.length}</div><div class="s">${rp(sum(C))}</div></div>
 <div class="card kpi"><div class="l">Sudah dikoreksi admin</div><div class="v">${db?edited:'–'}</div><div class="s">${late} berstatus invoice TERLAMBAT</div></div></div>
 <div class="grid k2">${blk('BAOF Belum Clear',BELUM,B,'red','belum')}${blk('BAOF Sudah Clear',CLEAR,C,'grn','clear')}</div>
 <p class="mu">Klik salah satu status untuk melihat daftar tagihannya. Nominal = Nominal SPK.</p>`}
function list(){const g=tab,sts=g==='belum'?BELUM:CLEAR;
 let L=DATA.filter(r=>grp(r)===g);const tot=L.length;
 if(fSt==='__kosong')L=L.filter(r=>!cur(r));else if(fSt)L=L.filter(r=>cur(r)===fSt);if(onlyEd)L=L.filter(r=>OV[r.id]);
 if(q){const k=q.toLowerCase();L=L.filter(r=>[r.spk,r.nt,r.kt,r.sp,r.baof,r.jp,r.jt].join(' ').toLowerCase().includes(k))}
 L.sort((a,b)=>((a[sortK]>b[sortK])-(a[sortK]<b[sortK]))*sortD);
 const th=(k,l)=>`<th onclick="srt('${k}')">${l}${sortK===k?(sortD>0?' ▲':' ▼'):''}</th>`;
 $('#view').innerHTML=`<div class="tools"><input type="search" id="q" placeholder="Cari No SPK, toko, supplier, No BAOF…" value="${esc(q)}">
 <select id="fs"><option value="">Semua status (${tot})</option>${sts.map(s=>`<option ${s===fSt?'selected':''}>${esc(s)}</option>`).join('')}<option value="__kosong" ${fSt==='__kosong'?'selected':''}>Belum ada status (${DATA.filter(r=>grp(r)===g&&!cur(r)).length})</option></select>
 <label class="mu"><input type="checkbox" id="oe" ${onlyEd?'checked':''}> hanya yang sudah dikoreksi</label><span class="mu">${L.length} baris · ${rp(L.reduce((a,r)=>a+r.nom,0))}</span></div>
 <div class="tw"><table><thead><tr>${th('spk','No SPK')}${th('nt','Toko')}${th('sp','Supplier')}${th('jt','Termin')}${th('tjt','Jatuh Tempo')}${th('baof','No BAOF')}${th('nom','Nominal')}${th('ds','Status')}<th>Terakhir diedit</th><th></th></tr></thead><tbody>
 ${L.map(r=>{const o=OV[r.id],s=cur(r);return `<tr><td>${r.spk}</td><td>${esc(r.nt)}<div class="mu">${r.kt} · ${esc(r.jp)}</div></td><td>${esc(r.sp)}</td><td>${esc(r.jt)}</td><td>${dmy(r.tjt)}</td><td>${r.baof||'<span class="mu">–</span>'}</td><td class="n">${rp(r.nom)}</td>
 <td>${s?`<span class="badge ${grp(r)==='belum'?'b-red':'b-grn'}">${esc(s)}</span>`:'<span class="badge b-amb">Belum ada status</span>'}${o?'':s?'<div class="mu">otomatis dari TTFA/BBK</div>':''}${o?.note?`<div class="mu">📝 ${esc(o.note)}</div>`:''}</td>
 <td class="mu">${o?`${esc(names[o.by]||'…')}<br>${dtm(o.at)}`:'Belum pernah diedit'}</td>
 <td><button class="btn ghost" onclick="openM('${r.id}')">${isAdmin?'Periksa / Koreksi':'Detail'}</button></td></tr>`}).join('')||'<tr><td colspan="10" class="mu">Tidak ada data.</td></tr>'}</tbody></table></div>`;
 $('#q').oninput=e=>{q=e.target.value;const p=e.target.selectionStart;list();const i=$('#q');i.focus();i.setSelectionRange(p,p)};
 $('#fs').onchange=e=>{fSt=e.target.value;list()};$('#oe').onchange=e=>{onlyEd=e.target.checked;list()}}
function srt(k){sortD=sortK===k?-sortD:1;sortK=k;list()}
function render(){tab==='dash'?dash():list()}
function openM(id){const r=DATA.find(x=>x.id===id),o=OV[id],s=cur(r);
 $('#box').innerHTML=`<h2>SPK ${r.spk} – ${esc(r.nt)}</h2><div class="mu">${esc(r.sp)} · ${esc(r.jt)}</div>
 <dl><dt>Jatuh tempo</dt><dd>${dmy(r.tjt)}</dd><dt>Nominal SPK</dt><dd>${rp(r.nom)}</dd><dt>Status SPK</dt><dd>${esc(r.ss)}</dd><dt>No BAOF</dt><dd>${r.baof||'– (belum ada)'}</dd><dt>Tgl Final Approve BA</dt><dd>${dmy(r.fa)}</dd><dt>Tgl TTFA</dt><dd>${dmy(r.ttfa)}</dd><dt>Tgl BBK</dt><dd>${dmy(r.bbk)}</dd><dt>Status invoice</dt><dd>${esc(r.inv)}</dd>
 <dt>Dasar status awal</dt><dd>${esc(r.ds||'(kosong)')} <span class="mu">(${esc(r.src)})</span></dd>
 <dt>Terakhir diedit</dt><dd>${o?esc(names[o.by]||'…')+' · '+dtm(o.at):'Belum pernah diedit'}</dd></dl>
 ${isAdmin&&db?`<label>Status (koreksi)</label><select id="ms"><option value="" ${!s?'selected':''}>— Kosong (belum ada status) —</option><optgroup label="BAOF Belum Clear">${BELUM.map(x=>`<option ${x===s?'selected':''}>${esc(x)}</option>`).join('')}</optgroup><optgroup label="BAOF Sudah Clear">${CLEAR.map(x=>`<option ${x===s?'selected':''}>${esc(x)}</option>`).join('')}</optgroup></select>
 <label>Catatan</label><textarea id="mn" rows="2">${esc(o?.note||'')}</textarea>
 <div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end"><button class="btn ghost" onclick="closeM()">Batal</button>${o?`<button class="btn ghost" onclick="reset('${id}')">Kembalikan ke status awal</button>`:''}<button class="btn" id="sv" onclick="save('${id}')">Simpan</button></div>`
 :`<div class="note">${db?'Hanya admin yang dapat mengoreksi status.':'Mode lihat saja (login diperlukan untuk koreksi).'}</div><div style="text-align:right"><button class="btn" onclick="closeM()">Tutup</button></div>`}
 ${o?.hist?.length?`<div class="hist"><b>Riwayat perubahan</b>${o.hist.slice().reverse().map(h=>`<div>${dtm(h.at)} · ${esc(names[h.by]||'…')} → ${esc(h.status)}${h.note?' · '+esc(h.note):''}</div>`).join('')}</div>`:''}`;
 $('#modal').classList.add('on')}
function closeM(){$('#modal').classList.remove('on')}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeM()};
async function save(id){const b=$('#sv');b.disabled=true;try{const me=await usr.id(),o=OV[id]||{},st=$('#ms').value,note=$('#mn').value.trim(),at=Date.now();
 const hist=[...(o.hist||[]),{status:st,note,by:me,at}].slice(-10);
 await col.doc(id).set({status:st,note,by:me,at,hist});closeM()}catch(e){b.disabled=false;alert('Gagal menyimpan: '+(e.message||e.code))}}
async function reset(id){if(!confirm('Kembalikan ke status awal otomatis?'))return;try{await col.doc(id).delete();closeM()}catch(e){alert('Gagal: '+(e.message||e.code))}}
async function resolveNames(){const ids=new Set();Object.values(OV).forEach(o=>{ids.add(o.by);(o.hist||[]).forEach(h=>ids.add(h.by))});
 const need=[...ids].filter(i=>i&&!names[i]);if(!need.length||!usr)return;try{const p=await usr.profiles(need);need.forEach(i=>names[i]=p[i]?.name||'Pengguna');render()}catch(e){}}
async function init(){nav();render();
 try{usr=await claude.use('user');db=await claude.use('db')}catch(e){}
 if(!db){$('#msg').innerHTML='<div class="note">Mode lihat saja: menampilkan status awal otomatis dari Excel. Koreksi &amp; riwayat edit membutuhkan login.</div>';return}
 try{isAdmin=await usr.canEdit()}catch(e){}
 col=db.collection('tagihan');
 col.onSnapshot(s=>{OV={};s.docs.forEach(d=>{if(d.exists)OV[d.id]=d.data()});render();resolveNames()},e=>{$('#msg').innerHTML='<div class="note">Gagal memuat data koreksi.</div>'})}
init();
</script></body></html>
