"trinitumimbang@gmail.com"
];

(function () {
  firebase.initializeApp(FB_CONFIG);
  const auth = firebase.auth(), fs = firebase.firestore();
  const ready = new Promise(res => {
    const off = auth.onAuthStateChanged(u => { off(); res(u); });
  });

  const btn = document.createElement('button');
  btn.className = 'btn ghost';
  btn.style.cssText = 'position:absolute;top:16px;right:20px';
  btn.textContent = 'Login Admin';
  document.querySelector('header').appendChild(btn);
  ready.then(u => {
    btn.textContent = u ? 'Logout (' + (u.displayName || u.email) + ')' : 'Login Admin';
    btn.onclick = u
      ? () => auth.signOut().then(() => location.reload())
      : () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
          .then(() => location.reload())
          .catch(e => alert('Login gagal: ' + e.message));
  });

  window.claude = {
    use: async name => {
      if (name === 'user') {
        const me = await ready;
        if (me) fs.collection('users').doc(me.uid)
          .set({ name: me.displayName || me.email }, { merge: true }).catch(() => {});
        return {
          id: async () => { if (!me) throw new Error('Belum login'); return me.uid; },
          canEdit: async () => !!me && ADMIN_EMAILS.includes((me.email || '').toLowerCase()),
          profiles: async ids => {
            const out = {};
            await Promise.all(ids.map(async i => {
              const d = await fs.collection('users').doc(i).get();
              if (d.exists) out[i] = d.data();
            }));
            return out;
          }
        };
      }
      if (name === 'downloads') return {
        save: async ({ filename, data }) => {
          const blob = new Blob([data], { type: 'application/octet-stream' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = filename;
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 2000);
        }
      };
      if (name === 'db') return { collection: n => fs.collection(n) };
      throw new Error('Tidak dikenal: ' + name);
    }
  };
})();
</script>

 <dl><dt>Jatuh tempo</dt><dd>${dmy(r.tjt)}</dd><dt>Nominal SPK</dt><dd>${rp(r.nom)}</dd><dt>Status SPK</dt><dd>${esc(r.ss)}</dd><dt>No BAOF</dt><dd>${r.baof||'– (belum ada)'}</dd><dt>Tgl Final Approve BA</dt><dd>${dmy(r.fa)}</dd><dt>Tgl TTFA (supplier menagihkan)</dt><dd>${dmy(effTtfa(r))}${tfOv(r)?` <span class="mu">(diedit admin; master: ${dmy(r.ttfa)})</span>`:''}</dd><dt>Tgl BBK (sudah terbayar)</dt><dd>${dmy(r.bbk)}</dd><dt>Status invoice</dt><dd>${esc(r.inv)}</dd>
 <dt>Status di Excel</dt><dd>${esc(r.xs||'– (kosong)')}</dd><dt>Dasar status awal</dt><dd>${esc(dsNow(r)||'(kosong)')} <span class="mu">(${r.bbk?'Tgl BBK terisi':effTtfa(r)?'Tgl TTFA terisi':'tidak ada TTFA/BBK'})</span></dd>
 <dt>Terakhir diedit</dt><dd>${o?esc(names[o.by]||'…')+' · '+dtm(o.at):'Belum pernah diedit'}</dd></dl>
 ${isAdmin&&db?`${r.xc?`<div class="note">Status di master Excel: <b>${esc(r.xc)}</b>. Koreksi admin berlaku sampai master Excel baru mengubah status ini.${o&&!ov(r)?' Koreksi sebelumnya sudah tidak berlaku karena status Excel berubah.':''}</div>`:''}<label>Status (koreksi)</label><select id="ms">${s&&!BELUM.includes(s)&&!CLEAR.includes(s)?`<option selected>${esc(s)}</option>`:''}<option value="" ${!s?'selected':''}>— Kosong (belum ada status) —</option><optgroup label="BAOF Belum Clear">${BELUM.map(x=>`<option ${x===s?'selected':''}>${esc(x)}</option>`).join('')}</optgroup><optgroup label="BAOF Sudah Clear">${CLEAR.map(x=>`<option ${x===s?'selected':''}>${esc(x)}</option>`).join('')}</optgroup></select>
 <label>Tgl TTFA (supplier sudah menagihkan)</label><input type="date" id="mt" value="${effTtfa(r)}" style="width:100%"><div class="mu" style="margin-top:3px">Kosongkan tanggal jika belum ditagihkan. Status otomatis ikut berubah jika status tidak dikoreksi manual.</div>
 <label>Catatan</label><textarea id="mn" rows="2">${esc(o?.note||'')}</textarea>
 <div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end"><button class="btn ghost" onclick="closeM()">Batal</button>${o?`<button class="btn ghost" onclick="reset('${id}')">Kembalikan ke data master</button>`:''}<button class="btn" id="sv" onclick="save('${id}')">Simpan</button></div>`
 :`<div class="note">${db?'Hanya admin yang dapat mengoreksi status.':'Mode lihat saja (login diperlukan untuk koreksi).'}</div><div style="text-align:right"><button class="btn" onclick="closeM()">Tutup</button></div>`}
 ${o?.hist?.length?`<div class="hist"><b>Riwayat perubahan</b>${o.hist.slice().reverse().map(h=>`<div>${dtm(h.at)} · ${esc(names[h.by]||'…')} → ${esc(h.status)}${h.tf!==undefined?' · TTFA '+(h.tf?dmy(h.tf):'dihapus'):''}${h.note?' · '+esc(h.note):''}</div>`).join('')}</div>`:''}`;
 $('#modal').classList.add('on')}
function closeM(){$('#modal').classList.remove('on')}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeM()};
async function save(id){const b=$('#sv');b.disabled=true;try{const me=await usr.id(),r=DATA.find(x=>x.id===id),pv=OV[id]||{},st=$('#ms').value,tf=$('#mt').value,note=$('#mn').value.trim(),at=Date.now(),doc={note,by:me,at},tfNew=tf!==effTtfa(r);
 if(st!==cur(r)){doc.status=st;doc.xs0=r.xc||''}else if(pv.status!==undefined){doc.status=pv.status;doc.xs0=pv.xs0||''}
 if(tfNew){doc.ttfa=tf;doc.tf0=r.ttfa}else if(pv.ttfa!==undefined){doc.ttfa=pv.ttfa;doc.tf0=pv.tf0||''}
 const h={status:doc.status!==undefined?doc.status:cur(r),note,by:me,at};if(tfNew)h.tf=tf;
 doc.hist=[...(pv.hist||[]),h].slice(-10);
 await col.doc(id).set(doc);closeM()}catch(e){b.disabled=false;alert('Gagal menyimpan: '+(e.message||e.code))}}
async function reset(id){if(!confirm('Kembalikan status dan tanggal TTFA ke data master?'))return;try{await col.doc(id).delete();closeM()}catch(e){alert('Gagal: '+(e.message||e.code))}}
async function resolveNames(){const ids=new Set();if(META)ids.add(META.by);Object.values(OV).forEach(o=>{ids.add(o.by);(o.hist||[]).forEach(h=>ids.add(h.by))});
 const need=[...ids].filter(i=>i&&!names[i]);if(!need.length||!usr)return;try{const p=await usr.profiles(need);need.forEach(i=>names[i]=p[i]?.name||'Pengguna');banner();render()}catch(e){}}
const MON=k=>{const[y,m]=k.split('-');return new Date(+y,+m-1,1).toLocaleDateString('id-ID',{month:'long',year:'numeric'})};
const nk=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');const CAN={};[...BELUM,...CLEAR].forEach(s=>CAN[nk(s)]=s);Object.assign(CAN,{ttdbmdbm:'TTD Cabang (BM/DBM)',ttdbm:'TTD Cabang (BM/DBM)',draftbaof:'Proses Draft BAOF',otp:'OTP PPM',ttfa:'Supplier Sudah Menagihkan',sudahttfasuppliermenagihkan:'Supplier Sudah Menagihkan',suppliermenagihkan:'Supplier Sudah Menagihkan',bbk:'Sudah Terbayar',terbayar:'Sudah Terbayar',finance:'Sudah Masuk Finance',ttdcabang:'TTD Cabang (BM/DBM)',sudahfinalapprove:'Sudah Final Approve, Belum Ditagihkan'});
function dsOf(r){const x=String(r.xs||'').trim();r.xc=x&&x!=='-'&&!/^\(?kosong\)?$/i.test(x)?(CAN[nk(x)]||x):'';if(r.bbk){r.ds='Sudah Terbayar';r.src='Tgl BBK terisi'}else if(r.ttfa){r.ds='Supplier Sudah Menagihkan';r.src='Tgl TTFA terisi'}else{r.ds='';r.src='Tidak ada TTFA/BBK - status dikosongkan'}return r}
EMBED.forEach(dsOf);
let META=null,dl=null,PARSED=null;const pad=n=>String(n).padStart(2,'0');
function iso(v){if(v instanceof Date){if(isNaN(v))return '';const w=new Date(v.getTime()+60000);return w.getFullYear()+'-'+pad(w.getMonth()+1)+'-'+pad(w.getDate())}
 if(typeof v==='number'){const p=XLSX.SSF.parse_date_code(v);return p?p.y+'-'+pad(p.m)+'-'+pad(p.d):''}
 const s=String(v??'').trim();if(!s||s==='-')return '';let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3];m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);return m?m[3]+'-'+pad(m[2])+'-'+pad(m[1]):''}
const COLS=['NO SPK','KODE TOKO','NAMA TOKO','JENIS PROPOSAL','NAMA SUPPLIER','JENIS TAGIHAN','TGL JATUH TEMPO','TGL TTFA','TGL BBK','NO BERITA ACARA','TGL FINAL APPROVE BA','STATUS SPK','NOMINAL SPK','STATUS INVOICE'];
function parseXlsx(buf){const wb=XLSX.read(buf,{type:'array',cellDates:true});
 for(const sn of wb.SheetNames){const A=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});
  const hi=A.findIndex(r=>r.some(c=>String(c).trim().toUpperCase()==='NO SPK'));if(hi<0)continue;
  const H=A[hi].map(c=>String(c).trim().toUpperCase().replace(/\s+/g,' ')),ix={};COLS.forEach(c=>ix[c]=H.indexOf(c));ix['STATUS TERBARU']=H.indexOf('STATUS TERBARU');
  const miss=COLS.filter(c=>ix[c]<0);if(miss.length)throw new Error('Kolom tidak ditemukan: '+miss.join(', '));
  const hdr=A.slice(0,hi).flat().map(x=>String(x).trim()).filter(x=>x&&!/^tanggal/i.test(x)).join(' · ').slice(0,200),rows=[];
  A.slice(hi+1).forEach(a=>{const g=c=>a[ix[c]],spk=String(g('NO SPK')).trim();if(!spk||spk==='-'||/^rejected$/i.test(String(g('STATUS SPK')).trim()))return;
   const baof=String(g('NO BERITA ACARA')).trim(),xs=ix['STATUS TERBARU']>=0?String(g('STATUS TERBARU')).trim():'';let nom=g('NOMINAL SPK');nom=typeof nom==='number'?nom:parseFloat(String(nom).replace(/[^\d.-]/g,''))||0;
   rows.push({spk,kt:String(g('KODE TOKO')).trim(),nt:String(g('NAMA TOKO')).trim(),jp:String(g('JENIS PROPOSAL')).replace('PEKERJAAN ','').toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase()),sp:String(g('NAMA SUPPLIER')).trim(),jt:String(g('JENIS TAGIHAN')).trim(),tjt:iso(g('TGL JATUH TEMPO')),ttfa:iso(g('TGL TTFA')),bbk:iso(g('TGL BBK')),baof:baof==='-'?'':baof,fa:iso(g('TGL FINAL APPROVE BA')),ss:String(g('STATUS SPK')).trim(),nom:Math.round(nom),inv:String(g('STATUS INVOICE')).trim(),xs:xs==='-'?'':xs})});
  return{rows,hdr}}
 throw new Error('Header "NO SPK" tidak ditemukan. Gunakan format master yang sama seperti sebelumnya.')}
function withIds(rows){const seen={};return rows.map(r=>{const b=r.spk+'-'+r.jt.replace(/ /g,'').replace(/%/g,'');seen[b]=(seen[b]||0)+1;return{...r,id:seen[b]===1?b:b+'-'+seen[b]}})}
const pick=k=>withIds(k==='all'?PARSED.rows:PARSED.rows.filter(r=>r.tjt.slice(0,7)===k));
const PL=m=>!m||m.period==='all'?'Semua Periode Jatuh Tempo':'Jatuh Tempo '+MON(m.period);
function banner(){const m=META;$('#pb').textContent=PL(m);document.title='Monitoring Outstanding Tagihan';
 $('#sub').textContent=m?`${m.hdr?m.hdr.split(' · ').filter(x=>!/^tanggal/i.test(x)).join(' · ')+' · ':''}Sumber: ${m.file} · diunggah oleh ${names[m.by]||'…'} · ${dtm(m.at)}`:'Cabang G156 – Klaten · Unit 03 PT. Indomarco Prismatama · Sumber: LAPORAN_MONITORING_OUTSTANDING_21102026.xlsx (data awal)'}
function acts(){$('#acts').innerHTML=(dl?`<button class="btn" onclick="exportXlsx()">⬇ Download Excel (status terbaru + rekap)</button>`:'')+(isAdmin&&db?`<button class="btn ghost" onclick="document.getElementById('fi').click()">⬆ Upload Master Baru</button>`:'')}
$('#fi').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 try{const P=parseXlsx(await f.arrayBuffer());P.file=f.name;const cnt={};P.rows.forEach(r=>{const k=r.tjt.slice(0,7);if(k)cnt[k]=(cnt[k]||0)+1});
  const ks=Object.keys(cnt).filter(k=>k!=='all').sort();if(!ks.length)throw new Error('Tidak ada tanggal jatuh tempo yang terbaca.');
  cnt.all=P.rows.length;P.cnt=cnt;P.ks=['all',...ks];P.def='all';PARSED=P;upModal()}catch(err){alert('Gagal membaca file: '+err.message)}};
function upModal(){const P=PARSED;$('#box').innerHTML=`<h2>Upload Master Baru</h2><div class="mu">${esc(P.file)} · ${P.rows.length} baris terbaca</div>
 <label>Periode jatuh tempo yang dipantau</label><select id="up" onchange="upInfo()">${P.ks.map(k=>`<option value="${k}" ${k===P.def?'selected':''}>${k==='all'?'Semua periode':MON(k)} (${P.cnt[k]} tagihan)</option>`).join('')}</select>
 <div class="note" style="margin-top:12px" id="upi"></div><div class="mu">Master aktif akan <b>diganti</b> untuk semua pengguna. Koreksi status &amp; riwayat edit tidak dihapus; dicocokkan lewat No SPK + Termin.</div>
 <div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end"><button class="btn ghost" onclick="closeM()">Batal</button><button class="btn" id="ap" onclick="applyUp()">Terapkan sebagai master</button></div>`;$('#modal').classList.add('on');upInfo()}
function upInfo(){const rows=pick($('#up').value),m=rows.filter(r=>OV[r.id]).length;$('#upi').textContent=`${rows.length} tagihan akan menjadi master aktif. ${rows.filter(r=>r.xs).length} terisi status dari kolom STATUS TERBARU. ${m} di antaranya punya koreksi/riwayat edit yang tetap terhubung.`}
async function applyUp(){const b=$('#ap');b.disabled=true;try{const k=$('#up').value,rows=pick(k),v=Date.now(),size=250,n=Math.ceil(rows.length/size),mc=db.collection('master'),old=META?.n||0,me=await usr.id();
 for(let i=0;i<n;i++)await mc.doc('c'+i).set({v,rows:rows.slice(i*size,(i+1)*size)});
 await mc.doc('meta').set({v,n,count:rows.length,period:k,file:PARSED.file,hdr:PARSED.hdr,by:me,at:v});
 for(let i=n;i<old;i++){try{await mc.doc('c'+i).delete()}catch(e){}}closeM()}catch(e){b.disabled=false;alert('Gagal mengunggah: '+(e.message||e.code))}}
function loadMaster(s){const m={};s.docs.forEach(d=>{if(d.exists)m[d.id]=d.data()});const me=m.meta;
 if(!me){META=null;DATA=EMBED;banner();render();return}
 const parts=[];for(let i=0;i<me.n;i++){const c=m['c'+i];if(!c||c.v!==me.v)return;parts.push(...c.rows)}
 META=me;DATA=parts.map(dsOf);banner();render();resolveNames()}
async function exportXlsx(){try{
 const lab=g=>g==='belum'?'BAOF Belum Clear':'BAOF Sudah Clear',rows=DATA.map(r=>({r,o:OV[r.id],s:cur(r)||'',g:grp(r)})),T=DATA.length||1;
 const aoa=[['REKAP STATUS TAGIHAN – '+$('#pb').textContent],['Dibuat: '+dtm(Date.now())],[],['Kelompok','Status','Jumlah Tagihan','Nominal SPK (Rp)','% Jumlah']];
 [['belum',[...BELUM,...extra('belum')]],['clear',[...CLEAR,...extra('clear')]]].forEach(([g,sts])=>{let n0=0,v0=0;[...sts,''].forEach(s=>{const L=rows.filter(x=>x.g===g&&x.s===s),n=L.length,v=L.reduce((a,x)=>a+x.r.nom,0);n0+=n;v0+=v;aoa.push([lab(g),s||'Belum ada status',n,v,n/T])});aoa.push(['Subtotal '+lab(g),'',n0,v0,n0/T],[])});
 aoa.push(['TOTAL','',DATA.length,DATA.reduce((a,r)=>a+r.nom,0),1]);
 const w1=XLSX.utils.aoa_to_sheet(aoa);for(let r=4;r<aoa.length;r++){if(aoa[r].length){[[2,'0'],[3,'#,##0'],[4,'0.0%']].forEach(([c,z])=>{const x=w1[XLSX.utils.encode_cell({r,c})];if(x)x.z=z})}}
 w1['!cols']=[{wch:30},{wch:40},{wch:16},{wch:20},{wch:12}];
 const head=['No','Kelompok','Status Terbaru','Sumber Status','Status di Master Excel','Catatan Admin','Terakhir Diedit Oleh','Terakhir Diedit Pada','No SPK','Kode Toko','Nama Toko','Jenis Proposal','Supplier','Termin','Tgl Jatuh Tempo','No BAOF','Tgl Final Approve BA','Tgl TTFA (Supplier Menagihkan)','Tgl BBK (Sudah Terbayar)','Status SPK','Status Invoice','Nominal SPK (Rp)'];
 const body=rows.map(({r,o,s,g},i)=>[i+1,lab(g),s||'-',srcOf(r)||(s?'Data master (TTFA/BBK)':'Kosong'),r.xs||'-',o?.note||'',o?(names[o.by]||''):'',o?new Date(o.at).toLocaleString('id-ID'):'',r.spk,r.kt,r.nt,r.jp,r.sp,r.jt,dmy(r.tjt),r.baof||'-',dmy(r.fa),dmy(effTtfa(r)),dmy(r.bbk),r.ss,r.inv,r.nom]);
 const w2=XLSX.utils.aoa_to_sheet([head,...body]);body.forEach((_,i)=>{const x=w2[XLSX.utils.encode_cell({r:i+1,c:21})];if(x)x.z='#,##0'});
 w2['!autofilter']={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:body.length,c:head.length-1}})};
 w2['!cols']=[5,18,34,22,24,28,22,20,12,10,30,18,34,16,14,16,16,12,12,12,14,16].map(wch=>({wch}));
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,w1,'Rekap Status');XLSX.utils.book_append_sheet(wb,w2,'Detail Status');
 const out=XLSX.write(wb,{bookType:'xlsx',type:'array'}),d=new Date();
 await dl.save({filename:`Monitoring_Outstanding_${!META||META.period==='all'?'Semua-Periode':META.period}_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.xlsx`,data:out})}
 catch(e){if(e&&e.code!=='declined')alert('Gagal membuat file: '+(e.message||e.code))}}
async function init(){nav();fbar();render();banner();tick();setInterval(tick,1000);
 try{usr=await claude.use('user')}catch(e){}try{db=await claude.use('db')}catch(e){}try{dl=await claude.use('downloads')}catch(e){}
 acts();
 if(!db){$('#msg').innerHTML='<div class="note">Mode lihat saja: menampilkan status awal otomatis dari Excel. Koreksi, riwayat edit &amp; upload master membutuhkan login.</div>';return}
 try{isAdmin=await usr.canEdit()}catch(e){}acts();
 col=db.collection('tagihan');
 col.onSnapshot(s=>{OV={};s.docs.forEach(d=>{if(d.exists)OV[d.id]=d.data()});render();resolveNames()},e=>{$('#msg').innerHTML='<div class="note">Gagal memuat data koreksi.</div>'});
 db.collection('master').onSnapshot(loadMaster,()=>{})}
init();
</script></body></html>
